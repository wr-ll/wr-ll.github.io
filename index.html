<!DOCTYPE html>
<html>
<head>
  <title>wrell</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: url('pfp.jpeg');
      backdrop-filter: blur(20px);
      background-size: cover;
      background-position: center;
      color: white;
    }

    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    .social-link {
      display: flex;
      align-items: center;
      height: 56px;
      margin-bottom: 15px;
      font-size: 1.2em;
      color: white;
      text-decoration: none;
    }

    .icon-link {
      font-size: 2em;
      margin-right: 20px;
    }

    #timestamp { /* Style for the timestamp */
      font-size: 1em;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <img src="pfp.jpeg" alt="Your Profile Picture">

  <h1>wrell</h1>
  <p>
    uni student studying cs & maths (with a heavy interest in RL)
  </p>
  <p>
    i also draw!! feel free to dm
    <br>
  </p>

  <script>
    function updateTimestamp() {
      const now = new Date();
      const options = {
        timeZone: 'Europe/London',
        hour: 'numeric',
        minute: 'numeric',
        second: 'numeric',
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      };
      const timestamp = now.toLocaleString('en-GB', options); // UK format
      const time = document.querySelector('#timestamp > time');
      time.setAttribute('datetime', now.toISOString());
      time.textContent = timestamp;
    }

    // Update the timestamp every second
    setInterval(updateTimestamp, 1000);
  </script>
